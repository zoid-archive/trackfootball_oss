catalog:
  '@cloudflare/vite-plugin': 1.70.1
  '@cloudflare/workers-types': 5.20261123.1
  '@garmin/fitsdk': ^21.222.0
  '@stricli/auto-complete': 1.3.0
  '@stricli/core': 1.3.0
  '@tailwindcss/vite': 4.3.5
  '@tmcw/togeojson': 7.1.4
  '@types/geojson': 7946.0.16
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@xmldom/xmldom': 0.9.12
  better-auth: 1.7.27
  capnweb: 0.12.0
  cross-env: ^10.1.0
  geojson: 0.5.0
  knip: ^6.47.0
  kysely: ^0.29.9
  kysely-postgres-js: ^5.1.0
  lefthook: 2.2.2
  postgres: 4.1.1
  prettier: 3.10.1
  react: 19.3.1
  react-dom: 19.3.1
  react-server-dom-webpack: 19.3.1
  rwsdk: 1.7.5
  tailwindcss: 4.3.5
  tiny-invariant: 1.3.3
  ts-pattern: 5.9.2
  typescript: 7.0.2
  vite: 8.3.8
  vitest: 5.1.1
  wrangler: 4.166.0
  zod: 4.6.7

catalogMode: strict

cleanupUnusedCatalogs: true

minimumReleaseAge: 4320

# Only exclude trusted packages from stable, well-known publishers
# (e.g., Cloudflare, DefinitelyTyped) where fast adoption matters
# and the risk of a bad release is low.
minimumReleaseAgeExclude:
  - '@cloudflare/*' # Cloudflare platform packages
  - wrangler # Cloudflare CLI, tracks platform releases
  - miniflare # Cloudflare local runtime, released in lockstep with Wrangler
  - workerd # Cloudflare runtime, transitive dep of wrangler

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - sharp
  - workerd
overrides:
  glob@>=9.0.0 <=14.0.1: '>=14.0.2'
  minimatch@>=7.0.0 <11.0.1: '>=11.0.1'
  webpack@>=5.49.0 <5.104.0: '>=5.104.0'
  webpack@>=5.49.0 <=5.104.0: '>=5.104.1'
  zod@<4.6.6: '>=4.6.6'
