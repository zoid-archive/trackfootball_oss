  '@types/node': 26.6.5
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@xmldom/xmldom': 0.9.12
  better-auth: 1.7.12
  capnweb: 0.12.0
  cross-env: ^10.1.0
  geojson: 0.5.0
  knip: ^6.42.1
  kysely: ^0.29.7
  kysely-postgres-js: ^5.0.1
  lefthook: 2.2.2
  postgres: 3.4.9
  prettier: 3.9.10
  react: 19.3.1
  react-dom: 19.3.1
  react-server-dom-webpack: 19.3.1
  rwsdk: 1.7.5
