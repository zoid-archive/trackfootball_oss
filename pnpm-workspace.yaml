  typescript: 7.0.2
  vite: 8.3.5
  vitest: 5.0.5
  wrangler: 4.152.0
  zod: 4.6.7

catalogMode: strict

cleanupUnusedCatalogs: true

minimumReleaseAge: 4320

# Only exclude trusted packages from stable, well-known publishers
# (e.g., Cloudflare, DefinitelyTyped) where fast adoption matters
# and the risk of a bad release is low.
minimumReleaseAgeExclude:
  - '@cloudflare/*' # Cloudflare platform packages
  - wrangler # Cloudflare CLI, tracks platform releases
  - miniflare # Cloudflare local runtime, released in lockstep with Wrangler
  - workerd # Cloudflare runtime, transitive dep of wrangler

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - sharp
  - workerd
overrides:
  undici@>=7.0.0 <7.30.1: '>=7.30.1'
  undici@>=7.15.0 <7.30.1: '>=7.30.1'
  undici@>=7.18.0 <7.30.1: '>=7.30.1'
  webpack@>=5.49.0 <5.104.0: '>=5.104.0'
  webpack@>=5.49.0 <=5.104.0: '>=5.104.1'
  zod@<4.6.6: '>=4.6.6'
